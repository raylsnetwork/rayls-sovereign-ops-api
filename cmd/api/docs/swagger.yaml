        in: query
        name: code
        required: true
        type: string
      - description: CSRF state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: authenticated
          schema:
            additionalProperties: true
            type: object
        "401":
          description: INVALID_CREDENTIAL
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: ROLE_ASSIGNMENT_PENDING, WALLET_REGISTERED or ACCOUNT_SUSPENDED
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: EMAIL_ALREADY_LINKED
