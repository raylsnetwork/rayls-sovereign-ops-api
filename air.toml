root = "."
tmp_dir = "tmp"

[build]
cmd = "swag init --parseDependency -q -g ./cmd/api/main.go -o ./cmd/api/docs && go build -gcflags 'all=-N -l' -o ./tmp/app/ops-api ./cmd/api/main.go"
bin = "/go/bin/dlv"
args_bin = ["exec", "--listen=:2345", "--headless", "--accept-multiclient", "--continue", "./tmp/app/ops-api", "--", "run"]
include_ext = ["go"]
exclude_dir = ["build", "tmp", "vendor", "testdata", "cmd/api/docs"]
delay = 1000
kill_delay = "0s"
send_interrupt = true
rerun = false

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
