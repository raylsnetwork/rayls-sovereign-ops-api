  /api/v1/admin/tokens/{address}/freeze:
    post:
      consumes:
      - application/json
      description: |-
        Freezes a registered token by submitting an operator-signed freeze to the TokenRegistry.
        The token address is taken from the path :address, never the body. The layer is one of
        "privacy_node" (freezeOnPrivacyNode — blocks all operations) or "public_chain"
        (freezeOnPublicChain — blocks public chain operations only). The Hub (PNH) layer is not
        supported here — hub freezing is a cross-chain operation owned by the Private Hub.
        Requires the PRIVACY_NODE_OPERATOR role. Returns 200 with no body.
      parameters:
      - description: Registered token contract address
        in: path
        name: address
        required: true
        type: string
      - description: Target freeze layer (privacy_node or public_chain)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.freezeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Freeze a registered token at a layer (operator)
      tags:
      - tokens
  /api/v1/admin/tokens/{address}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Moves a registered token through the PN lifecycle by submitting an operator-signed
        updatePrivacyNodeStatus to the TokenRegistry. The token address is taken from the path
        :address, never the body. Allowed statuses are "authorized" and "unauthorized";
        "undefined", "waiting_approval" (the initial state set by registration) and
        "frozen" are rejected. Freezing/unfreezing has dedicated contract methods
        (freezeOnPrivacyNode/unfreezeOnPrivacyNode) exposed via the freeze/unfreeze endpoints.
        Requires the PRIVACY_NODE_OPERATOR role. Returns 200 with no body.
      parameters:
      - description: Registered token contract address
        in: path
        name: address
        required: true
        type: string
      - description: New privacyNodeStatus (\
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.setTokenStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set a registered token's privacy-node status (operator)
      tags:
      - tokens
  /api/v1/admin/tokens/{address}/submit:
    post:
      consumes:
      - application/json
      description: |-
        Submits an AUTHORIZED token to another layer by submitting an operator-signed
        submitToHub / submitToPublicChain to the TokenRegistry. The token address is taken from
        the path :address, never the body. The target is one of "hub" (submitToHub — sends
        addToken() to the Private Hub and moves hubStatus to WAITING_APPROVAL) or "public_chain"
        (submitToPublicChain — moves publicChainStatus to PENDING_DEPLOYMENT). Submitting only
        initiates the flow; activation on the Hub and deployment on the Public Chain complete
        later via cross-chain PNH / relayer callbacks. Requires privacyNodeStatus == AUTHORIZED
        (enforced on-chain; a token not yet authorized reverts as 422) and the
        PRIVACY_NODE_OPERATOR role. Returns 200 with no body.
      parameters:
      - description: Registered token contract address
        in: path
        name: address
        required: true
        type: string
      - description: Target layer (hub or public_chain)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.submitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit a registered token to the Hub or Public Chain (operator)
      tags:
      - tokens
  /api/v1/admin/tokens/{address}/unfreeze:
    post:
      consumes:
      - application/json
      description: |-
        Unfreezes a registered token by submitting an operator-signed unfreeze to the
