definitions:
  cmd_api_adapters_handlers.addressPairResponse:
    properties:
      created_at:
        type: string
      private_chain_address:
        type: string
      public_chain_address:
        type: string
      status:
        type: integer
    type: object
  cmd_api_adapters_handlers.bootstrapRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  cmd_api_adapters_handlers.burnRequest:
    properties:
      amount:
        type: string
      from:
        type: string
      tokenId:
        type: string
    type: object
  cmd_api_adapters_handlers.deployTokenRequest:
    properties:
      decimals:
        type: integer
      name:
        type: string
      standard:
        type: string
      symbol:
        type: string
      uri:
        type: string
    required:
    - standard
    type: object
  cmd_api_adapters_handlers.deployTokenResponse:
    properties:
      deployedAddress:
        type: string
      standard:
        type: string
      txHash:
        type: string
    type: object
  cmd_api_adapters_handlers.freezeRequest:
    properties:
      layer:
        type: string
    type: object
  cmd_api_adapters_handlers.meResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture:
        type: string
      roles:
        items:
          type: string
        type: array
      wallet_address:
        type: string
    type: object
  cmd_api_adapters_handlers.mintRequest:
    properties:
      amount:
        type: string
      data:
        type: string
      to:
        type: string
      tokenId:
        type: string
    type: object
  cmd_api_adapters_handlers.pauseRequest:
    properties:
      paused:
        type: boolean
    type: object
  cmd_api_adapters_handlers.pendingUserAddressPairsResponse:
    properties:
      address_pairs:
        items:
          $ref: '#/definitions/cmd_api_adapters_handlers.addressPairResponse'
        type: array
      user_id:
        type: string
    type: object
  cmd_api_adapters_handlers.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  cmd_api_adapters_handlers.registeredTokenResponse:
    properties:
      address:
        type: string
      name:
        type: string
      standard:
        type: integer
      status:
        type: integer
      symbol:
        type: string
      updated_at:
        type: string
      uri:
        type: string
    type: object
  cmd_api_adapters_handlers.setApprovalStatusRequest:
    properties:
      private_address:
        type: string
      public_address:
        type: string
      status:
        type: integer
    type: object
  cmd_api_adapters_handlers.setTokenStatusRequest:
    properties:
      status:
        type: string
    type: object
  cmd_api_adapters_handlers.siweVerifyRequest:
    properties:
      address:
        example: 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045
        type: string
      nonce:
        example: abc123xyz
        type: string
      signature:
        example: 0xabc123...
        type: string
    type: object
  cmd_api_adapters_handlers.submitRequest:
    properties:
      target:
        type: string
    type: object
  cmd_api_adapters_handlers.teleportRequest:
    properties:
      amount:
        type: string
      data:
        type: string
      from:
        type: string
      standard:
        type: integer
      to:
        type: string
      tokenId:
        type: string
    type: object
  cmd_api_adapters_handlers.teleportResponse:
    properties:
      tx_hash:
        type: string
    type: object
  cmd_api_adapters_handlers.tokenListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/cmd_api_adapters_handlers.tokenResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  cmd_api_adapters_handlers.tokenResponse:
    properties:
      contractAddress:
        type: string
      decimals:
        type: integer
      ercStandard:
        type: integer
      ercStandardLabel:
        type: string
      holderCount:
        type: integer
      id:
        type: string
      issuerId:
        type: string
      metadataUrl:
        type: string
      name:
        type: string
      status:
        type: integer
      statusLabel:
        type: string
      symbol:
        type: string
      tokenClass:
        type: string
      totalSupply:
        type: string
    type: object
  cmd_api_adapters_handlers.txResponse:
    properties:
      txHash:
        type: string
    type: object
  cmd_api_adapters_handlers.walletBalanceResponse:
    properties:
      balance:
        type: string
      blockNumber:
        type: integer
      decimals:
        type: integer
      tokenAddress:
        type: string
      tokenName:
        type: string
      tokenSymbol:
        type: string
      updatedAt:
        type: string
      walletAddress:
        type: string
    type: object
  ops-api_cmd_api_core.TokenDeployEstimate:
    properties:
      gasLimit:
        type: integer
      gasPriceWei:
        type: string
      totalFeeWei:
        description: gasLimit * gasPriceWei
        type: string
    type: object
  ops-api_cmd_api_core.TokenFunction:
    properties:
      name:
        description: friendly name (mint/burn/...), empty if unknown
        type: string
      selector:
        description: 4-byte selector, e.g. "0x40c10f19"
        type: string
    type: object
  ops-api_cmd_api_core.TokenPermissions:
    properties:
      canBurn:
        type: boolean
      canMint:
        type: boolean
      canPause:
        description: |-
          CanPause reports whether this wallet is the stablecoin's `pauser`. Deliberately not
          derived from AM roles: pause()/unpause() are gated on a msg.sender equality check
          against the contract's own `pauser` address. False for non-stablecoins, which have no
          pause function at all.
        type: boolean
      canSubmitTokenUpdate:
        type: boolean
      contractAddress:
        type: string
      functions:
        items:
          $ref: '#/definitions/ops-api_cmd_api_core.TokenFunction'
        type: array
      isPaused:
        description: |-
          IsPaused is the ACCESS MANAGER's pause on this managed contract (mirrored from its
          ContractPauseUpdated events) — NOT the stablecoin's own `paused` state variable.
        type: boolean
      isTokenPaused:
        description: |-
          IsTokenPaused is the stablecoin's OWN `paused` flag, read live from the contract — the
          one that actually halts transfers. Distinct from IsPaused above; false for standards
          with no pause function.
        type: boolean
      walletAddress:
        type: string
    type: object
  ops-api_cmd_api_utils.ErrorResponse:
    properties:
      error:
        type: string
      hint:
        type: string
    type: object
info:
  contact: {}
paths:
  /admin/bootstrap:
    post:
      consumes:
      - application/json
      description: One-time endpoint that creates the initial admin user with an HSM
        wallet. Returns the wallet address for on-chain role assignment. Returns 409
        if any user already exists.
      parameters:
      - description: Admin email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.bootstrapRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bootstrap admin
      tags:
      - admin
  /api/me:
    get:
      description: Returns profile information for the authenticated PRIVACY_NODE_OPERATOR.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.meResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user
      tags:
      - users
  /api/me/address-pairs:
    get:
      description: |-
        Returns the authenticated user's on-chain address pairs from RNUserGovernance, derived
        from the JWT (keccak256 of the user ID). Omitting the status filter returns all pairs;
        status=0 returns only pending pairs.
      parameters:
      - description: Filter by approval status
        enum:
        - 0
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cmd_api_adapters_handlers.addressPairResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List own address pairs
      tags:
      - onboarding
    post:
      description: |-
        Creates a fresh HSM wallet pair (private + public chain) and registers it on-chain in
        RNUserGovernance as a pending pair. The on-chain write is operator-signed. Takes no body;
        each call creates a new pair, so a user accumulates many pairs over repeated calls.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.addressPairResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add an address pair
      tags:
      - onboarding
  /api/tokens:
    get:
      description: Returns a paginated list of tokens discovered by the indexer. Supports
        filtering by name, symbol and ERC type.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Filter by token name (case-insensitive, partial match)
        in: query
        name: name
        type: string
      - description: Filter by token symbol (case-insensitive, partial match)
        in: query
        name: symbol
        type: string
      - description: Filter by ERC standard (canonical labels)
        enum:
        - RAYLS_ERC20
        - RAYLS_ERC721
        - RAYLS_ERC1155
        - RAYLS_ENYGMA
        - RAYLS_ERC721_DVP
        - RAYLS_ERC1155_DVP
        - RAYLS_STABLECOIN
        in: query
        name: type
        type: string
      - description: Filter by the chain the token was deployed on (chainId)
        in: query
        name: issuerId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.tokenListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List tokens
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: Deploys a token via RNContractFactory, signed with the authenticated
        user's custody wallet.
      parameters:
      - description: Token to deploy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.deployTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.deployTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deploy a protocol token
      tags:
      - tokens
  /api/tokens/{address}:
    get:
      description: Returns the token identified by its contract address (case-insensitive).
      parameters:
      - description: Token contract address (0x...)
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get token details
      tags:
      - tokens
  /api/tokens/{address}/burn:
    post:
      consumes:
      - application/json
      description: |-
        Burns tokens on the token contract, signed with the authenticated user's custody wallet.
        Requires the burn permission. Body fields depend on standard: fungible uses {from,amount};
        ERC721 uses {tokenId}; ERC1155 uses {from,tokenId,amount}.
      parameters:
      - description: Token contract address
        in: path
        name: address
        required: true
        type: string
      - description: Burn parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.burnRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.txResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
      summary: Burn tokens
      tags:
      - tokens
  /api/tokens/{address}/mint:
    post:
      consumes:
      - application/json
      description: |-
        Mints tokens on the token contract, signed with the authenticated user's custody wallet.
        Requires the user's wallet to hold the mint permission (Access Manager). Body fields depend
        on the token standard: fungible uses {to,amount}; ERC721 uses {to,tokenId}; ERC1155 uses {to,tokenId,amount,data}.
      parameters:
      - description: Token contract address
        in: path
        name: address
        required: true
        type: string
      - description: Mint parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.mintRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.txResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
      summary: Mint tokens
      tags:
      - tokens
  /api/tokens/{address}/pause:
    post:
      consumes:
      - application/json
      description: |-
        Calls pause() or unpause() on the token contract, signed with the authenticated
        user's custody wallet. Stablecoin only (RAYLS_STABLECOIN): other standards have no
        pause function. Authorization is NOT an Access Manager role — the contract accepts
        only its own `pauser` address, so the caller's wallet must equal it.
      parameters:
      - description: Token contract address
        in: path
        name: address
        required: true
        type: string
      - description: Desired paused state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.pauseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.txResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
      summary: Pause or unpause a stablecoin
      tags:
      - tokens
  /api/tokens/{address}/permissions:
    get:
      description: |-
        Returns, for the authenticated user's custody wallet, which Access Manager-gated
        functions (mint/burn/...) it can call on the token, plus convenience flags.
      parameters:
      - description: Token contract address (0x...)
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ops-api_cmd_api_core.TokenPermissions'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get token permissions for the current user
      tags:
      - tokens
  /api/tokens/{address}/register:
    post:
      description: |-
        Adds an already-deployed token contract (at the path :address) to the on-chain
        TokenRegistry catalog. Registration is address-only — the contract reads the token's
        name/symbol/standard/supply on-chain, so no request body is needed. The contract must
        have deployed code (EOAs and empty addresses are rejected). The on-chain write is
        operator-signed; the token starts in WAITING_APPROVAL status (privacyNodeStatus 1).
        This does not deploy a token — that remains POST /api/tokens.
      parameters:
      - description: Deployed token contract address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.registeredTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a token
      tags:
      - tokens
  /api/tokens/{address}/teleport:
    post:
      consumes:
      - application/json
      description: |-
        Calls teleportToPublicChain on the token contract, signed with the authenticated user's
        custody wallet, after a mandatory preflight (token registered & active, caller balance/ownership).
        Supports only ERC20, ERC721 and ERC1155. Body fields depend on the standard: ERC20 uses
        {to,amount}; ERC721 uses {to,tokenId}; ERC1155 uses {to,tokenId,amount,data}. amount is in
        base units. {from} is required and selects which of the caller's wallets signs (msg.sender);
        it must be one of the caller's active private-chain custody wallets.
      parameters:
      - description: Token contract address
        in: path
        name: address
        required: true
        type: string
      - description: Teleport parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.teleportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api_adapters_handlers.teleportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
      summary: Teleport tokens to the public chain
      tags:
      - tokens
  /api/tokens/estimate:
    post:
      consumes:
      - application/json
      description: Returns the real gas estimate (eth_estimateGas + gas price) for
        deploying a token via RNContractFactory, signed by the authenticated user's
        custody wallet. Does not deploy.
      parameters:
      - description: Token to estimate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api_adapters_handlers.deployTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ops-api_cmd_api_core.TokenDeployEstimate'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ops-api_cmd_api_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Estimate token deploy gas
      tags:
      - tokens
  /api/tokens/registry:
    get:
      description: |-
        Returns all tokens in the on-chain TokenRegistry catalog. This is the registry
        catalog (read from-chain), distinct from GET /api/tokens, which lists indexer-discovered
        tokens. No query parameters are accepted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cmd_api_adapters_handlers.registeredTokenResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List registered tokens
      tags:
      - tokens
  /api/tokens/registry/pending:
    get:
      description: |-
        Returns only the pending tokens in the on-chain TokenRegistry catalog — those in the
        WAITING_APPROVAL status (privacyNodeStatus 1), i.e. registered but not yet approved by
        an operator. No query parameters are accepted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cmd_api_adapters_handlers.registeredTokenResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
